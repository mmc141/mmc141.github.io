<!DOCTYPE html>
<html>
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet">

<title> Maddie's Wares </title>
<style>

body {
background-image: url("celtic background.jpeg");
background-size: cover;
}

.navbar {
display: grid;
width: 80%;
height: 40px;
margin: auto;
background-color: rgba(255, 255, 255, 0.13);
backdrop-filter: blur(20px);
border-radius: 20px;
}

.navbar div {
grid-row-start: 1;
grid-row-end: 4;
align-content:center;
padding: 0px 18px;
}

.navbar-logo {
background: -webkit-linear-gradient(135deg, #8e560b, #f6d66d, #fff4b8, #b87014);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
font-family: Bodoni Moda;
opacity: 0.8;
transform: scaleY(1.4);
font-size: 160%;
}

.navbar-link a {
text-decoration: none;
background: -webkit-linear-gradient(135deg, #8e560b, #f6d66d, #fff4b8, #b87014);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
font-family:Bodoni Moda;
transform:scaleY(1.4);
opacity:0.8;
}.contact {
display: grid;
padding: 30px;
}

.contact-head {
background: -webkit-linear-gradient(135deg, #8e560b, #f6d66d, #fff4b8, #b87014);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
opacity:0.8;
font-family: Bodoni Moda;
transform: scaleY(1.4);
font-size: 400%;
padding:10px;
}

.contact-message {
width:50%;
background: -webkit-linear-gradient(135deg, #8e560b, #f6d66d, #fff4b8, #b87014);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
opacity:0.8;
font-family: Bodoni Moda;
transform: scaleY(1.4);
font-size: 140%;
padding:40px;
}

.contact-info {
width:50%;
background: -webkit-linear-gradient(135deg, #8e560b, #f6d66d, #fff4b8, #b87014);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
opacity:0.8;
font-family: Bodoni Moda;
transform: scaleY(1.4);
padding:40px;
font-size:160%;
}

</style>
</head>

<body>

<div class="navbar">
   <div class="navbar-logo">MW</div>
   <div class="navbar-link"><a href="index.html">HOME</a></div>
   <div class="navbar-link"><a href="photogallery.html">PHOTO GALLERY</a></div>
   <div class="navbar-link"><a href="contact.html">CONTACT</a></div>
</div>

<div class="contact">
   <div class="contact-head">CONTACT ME</div>
   <div class="contact-message">Thank you for visiting my site. I don't sell my wares directly through this site. If you have any interest in the things I've made, or have any questions for me, please feel free to reach out!</div>
   <div class="contact-info">email : maddieswares@gmail.com</div>
</div>

</body>
</html>
