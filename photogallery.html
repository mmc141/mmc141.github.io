<title> Maddie's Wares </title>
<style>

body {
background-image: url("b4.jpeg");
background-size: cover;
background-attachment: fixed;
}

.navbar {
display: grid;
width: 80%;
height: 40px;
margin: auto;
background-color: rgba(255, 255, 255, 0.13);
backdrop-filter: blur(20px);
border-radius: 20px;
}

.navbar div {
grid-row-start: 1;
grid-row-end: 4;
align-content:center;
padding: 0px 18px;
}

.navbar-logo {
color: white;
font-family: Bodoni Moda;
opacity: 0.8;
transform: scaleY(1.4);
font-size: 160%;
}

.navbar-link a {
text-decoration: none;
color:white;
font-family:Bodoni Moda;
transform:scaleY(1.4);
opacity:0.8;
}

.navbar-link a:hover {
color: grey;
}


.title {
display:grid;
padding:30px;
}

.titlewords {
padding:10px;
color: white;
opacity:0.8;
font-family: Bodoni Moda;
transform:scaleY(1.4);
font-size:300%;
}

.blues {
display: grid;
grid-template-columns: repeat(3, 1fr);
column-gap: 20px;
row-gap: 20px;
align-items:end;
padding: 40px;
}

.pearls {
display: grid;
grid-template-columns: repeat(2, 1fr);
column-gap: 20px;
padding: 40px;
}

.romans {
display: grid;
grid-template-columns: 3fr 4fr 3fr;
column-gap:20px;
padding:40px;
align-items:end;
}

.greens {
display:grid;
grid-template-columns: repeat(2, 1fr);
aligns-items:end;
column-gap:20px;
row-gap:20px;
padding:40px;
}

.turquoises {
display: grid;
grid-template-columns: 1fr 1fr;
column-gap:20px;
padding:40px;
}

.twindangles {
display:grid;
grid-template-columns:1fr 1fr;
column-gap:20px;
row-gap:20px;
padding:40px;
}

.seaglasses {
display:grid;
grid-template-columns:repeat(3,1fr);
column-gap:20px;
padding:40px;
}

.wooden {
display:grid;
grid-template-columns:35% 21% 21% 21%;
column-gap:20px;
row-gap:20px;
padding:40px;
align-items:end;
}
.tallitem {
grid-row: 1/span 2;
}

.bluerounds {
display:grid;
grid-template-columns:repeat(3,1fr);
column-gap:20px;
padding:40px;
align-items:end;
}

.rounds {
display:grid;
grid-template-columns:auto auto;
column-gap:20px;
padding:40px;
}

img {
max-width: 100%;
}


</style>
