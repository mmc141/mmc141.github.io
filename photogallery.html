<style>

body {

.navbar {
display: grid;
width: 80%;
height: 40px;
margin: auto;
background-color: rgba(255, 255, 255, 0.13);
backdrop-filter: blur(20px);
border-radius: 20px;
}

.navbar div {
grid-row-start: 1;
grid-row-end: 4;
align-content:center;
padding: 0px 18px;
}

.navbar-logo {
background: -webkit-linear-gradient(135deg, #8e560b, #f6d66d, #fff4b8, #b87014);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
font-family: Bodoni Moda;
opacity: 0.8;
transform: scaleY(1.4);
font-size: 160%;
}

.navbar-link a {
text-decoration: none;
background: -webkit-linear-gradient(135deg, #8e560b, #f6d66d, #fff4b8, #b87014);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
font-family:Bodoni Moda;
transform:scaleY(1.4);
opacity:0.8;
}

.title {
display:grid;
padding:30px;
}

.titlewords {

-webkit-text-fill-color: transparent;
opacity:0.8;
font-family: Bodoni Moda;
transform:scaleY(1.4);
font-size:300%;
}

.gold {
display: grid;
grid-template-columns: repeat(3, 1fr);
column-gap: 20px;
row-gap: 20px;
align-items: end;
padding: 40px;
}

.copper {

align-items: end;

.pearls {

column-gap: 20px;
padding: 40px;
}

.romans {

.greens {

padding:40px;

.turquoises {
display: grid;
grid-template-columns: 1fr 1fr;
column-gap:20px;
padding:40px;
}

.twindangles {
display:grid;
grid-template-columns:1fr 1fr;
column-gap:20px;
row-gap:20px;
padding:40px;
}

.seaglasses {
display:grid;
grid-template-columns:repeat(4,1fr);
column-gap:20px;
padding:40px;
}

.wooden {
display:grid;
grid-template-columns:35% 21% 21% 21%;
column-gap:20px;
row-gap:20px;
padding:40px;
align-items:end;
}
.tallitem {
grid-row: 1/span 2;
}

.bluerounds {
display:grid;
grid-template-columns:repeat(3,1fr);
column-gap:20px;
padding:40px;
align-items:end;
}

img {
